name: Deploy TCCC Evaluation Suite to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate static web release
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html app.js branding.js styles.css tiers.js version.js
            sw.js manifest.webmanifest
            assets/app-icon.png assets/icon-192.png assets/icon-512.png
            assets/splash-background.png
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required web file: $file"; exit 1; }
          done
          grep -Fq "versionName: '2.20.0-web.1'" version.js
          grep -Fq "const VERSION = '2.20.0-web.1'" sw.js
          grep -Fq "version.js?v=2.20.0-web.1" index.html
          grep -Fq "app.js?v=2.20.0-web.1" index.html
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 1
          echo "Static web release validation passed."

      - name: Stage static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html app.js branding.js styles.css tiers.js version.js sw.js manifest.webmanifest _site/
          cp -R assets _site/assets

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
